<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  {% seo %}
</head>
<body>

  <nav class="site-nav" id="site-nav">
    <div class="site-nav__inner">
      <a href="{{ '/' | relative_url }}" class="site-nav__brand">above and beyond <strong>data</strong></a>
      <button class="site-nav__toggle" aria-label="Toggle menu" id="nav-toggle">&#9776;</button>
      <ul class="site-nav__links" id="nav-links">
        <li><a href="{{ '/services/' | relative_url }}" {% if page.url contains '/services' %}class="active"{% endif %}>Services</a></li>
        <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>About</a></li>
        <li><a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}class="active"{% endif %}>Contact</a></li>
      </ul>
    </div>
  </nav>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">above and beyond <strong>data</strong> llc</div>
      <div class="site-footer__copy">&copy; {{ 'now' | date: '%Y' }} Above and Beyond Data LLC</div>
    </div>
  </footer>

  <script>
    document.getElementById('nav-toggle').addEventListener('click', function() {
      document.getElementById('nav-links').classList.toggle('is-open');
    });
  </script>

</body>
</html>
